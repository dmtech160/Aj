<!DOCTYPE html>

    <title>ASNIAH Gold Buy and Sale</title>
    <style>
        * {
            box-sizing: border-box;

        body {
            margin: 0;

        }
        .location {
            color: #777;
            margin-bottom: 25px;
        }
        .button {
            display: block;
            text-decoration: none;
            margin: 12px 0;
            padding: 15px;
            border-radius: 12px;
            background: #222;
            color: white;
            font-size: 16px;
            font-weight: bold;
        }
        .button:hover {
            opacity: 0.8;
        }
        .footer {
            margin-top: 25px;
