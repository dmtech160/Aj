<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ASNIAH Gold Buy and Sale</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background: #050505;
    color: white;
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.card {
    width: 100%;
    max-width: 390px;
    background: #111;
    border: 1px solid #d4af37;
    border-radius: 25px;
    padding: 30px 22px;
    text-align: center;
    box-shadow: 0 10px 35px rgba(212,175,55,0.20);
}

.profile {
    width: 125px;
    height: 125px;
    border-radius: 50%;
    object-fit: cover;
    border: 3px solid #d4af37;
    padding: 3px;
    margin-bottom: 15px;
}

h1 {
    margin: 0;
    color: #d4af37;
    font-size: 30px;
    letter-spacing: 2px;
}

.business {
    margin-top: 7px;
    color: #ddd;
    font-size: 15px;
}

.location {
    margin-top: 22px;
    color: #ccc;
    font-size: 14px;
}

.repair {
    margin-top: 22px;
    padding: 12px;
    border-top: 1px solid #333;
    border-bottom: 1px solid #333;
    color: #d4af37;
    font-size: 14px;
    font-weight: bold;
}

.buttons {
    margin-top: 25px;
    display: flex;
    flex-direction: column;
    gap: 11px;
}

.buttons a,
.call-button {
    width: 100%;
    padding: 14px;
    border-radius: 12px;
    text-decoration: none;
    font-size: 15px;
    font-weight: bold;
    border: none;
    cursor: pointer;
    display: block;
}

.call-button {
    background: #d4af37;
    color: #000;
}

.facebook {
    background: #1877f2;
    color: white;
}

.tiktok {
    background: #222;
    color: white;
    border: 1px solid #444 !important;
}

.map {
    background: #222;
    color: #d4af37;
    border: 1px solid #d4af37 !important;
}

.footer {
    margin-top: 22px;
    color: #666;
    font-size: 11px;
}

#phone-options {
    display: none;
    margin-top: 10px;
}

.phone {
    display: block;
    background: #222;
    color: white;
    padding: 11px;
    margin-top: 7px;
    border-radius: 9px;
    text-decoration: none;
    font-size: 14px;
}
</style>
</head>

<body>

<div class="card">

    <img
        class="profile"
        src="att._f5AR_ItghbXOusp9bH8PKn5EYZ2_XHSjDWBgyrt8kI.png.jpeg"
        alt="ASNIAH"
    >

    <h1>ASNIAH</h1>

    <div class="business">
        Gold Buying • Gold Selling
    </div>

    <div class="location">
        📍 Marawi City / Iligan City
    </div>

    <div class="repair">
        ✨ WE ALSO REPAIR DAMAGED GOLD ✨
    </div>

    <div class="buttons">

        <button class="call-button" onclick="showPhones()">
            📞 Call
        </button>

        <div id="phone-options">
            <a class="phone" href="tel:09451343033">
                0945 134 3033
            </a>

            <a class="phone" href="tel:09109136534">
                0910 913 6534
            </a>
        </div>

        <a
            class="facebook"
            href="https://www.facebook.com/Asnieeee?mibextid=ZbWKwL"
            target="_blank">
            📘 Facebook
        </a>

        <a
            class="tiktok"
            href="https://www.tiktok.com/@jash.shop143"
            target="_blank">
            ♪ TikTok
        </a>

        <a
            class="map"
            href="https://www.google.com/maps/search/?api=1&query=Marawi+City+Iligan+City"
            target="_blank">
            📍 Location
        </a>

    </div>

    <div class="footer">
        Digital Business Card
    </div>

</div>

<script>
function showPhones() {
    var options = document.getElementById("phone-options");

    if (options.style.display === "block") {
        options.style.display = "none";
    } else {
        options.style.display = "block";
    }
}
</script>

</body>
</html>
